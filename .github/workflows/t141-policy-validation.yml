name: T-141 Policy Creation Validation

on:
  push:
    branches:
      - feat/t-141-campaign-policies

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Migrations
        env:
          DATABASE_URL: sqlite:///./data/t141-policy-ci.db
        run: alembic upgrade head
      - name: Policy tests
        run: pytest tests/test_campaign_policies.py tests/test_campaign_engine_t065.py tests/test_campaigns.py
      - name: Full backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
