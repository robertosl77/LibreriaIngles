name: T-002 npm audit remediation

on:
  push:
    branches: [chore/t-002-npm-audit]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/t-002-npm-audit

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Apply compatible audit fixes
        working-directory: frontend
        run: npm audit fix || true

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Audit after compatible fixes
        working-directory: frontend
        run: npm audit --json || true

      - name: Commit compatible dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "fix(T-002): apply compatible npm audit fixes"
            git push origin chore/t-002-npm-audit
          fi
