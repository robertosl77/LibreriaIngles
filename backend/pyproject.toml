[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "libreria-ingles-backend"
version = "0.1.0"
description = "Backend de Librería Inglés"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "email-validator>=2.2,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "httpx>=0.27,<1.0",
  "alembic>=1.13,<2.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
