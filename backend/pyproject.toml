[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "libreria-ingles-backend"
version = "0.1.0"
description = "Backend de Librería Inglés"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "pydantic-settings>=2.5,<3.0",
  "email-validator>=2.2,<3.0",
  "httpx>=0.27,<1.0",
  "phonenumbers>=8.13,<9.0",
  "pyjwt>=2.8,<3.0",
  "cryptography>=42",
  "truststore>=0.10,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
     "agent-dev-kit[openai,anthropic,gemini,mcp] @ git+https://github.com/robertosl77/agent-dev-kit.git@v0.2.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]

[tool.setuptools.package-data]
app = ["curriculum/data/*.json", "curriculum/data/lessons/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

